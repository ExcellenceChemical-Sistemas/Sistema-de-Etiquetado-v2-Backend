name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-y-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los tests no usan la base ni Supabase (los servicios se prueban con mocks).
      - run: npm test
      - run: npm run build
